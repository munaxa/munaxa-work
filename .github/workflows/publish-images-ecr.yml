# Publishing Munaxa Work's images to Amazon ECR for the shared AWS stack (munaxa-platform
# infra/aws), so an ECS deployment pulls an artifact built and checked here, pinned by digest.
#
#   munaxa-work/api      apps/api/Dockerfile, target runtime
#   munaxa-work/migrate  apps/api/Dockerfile, target migrate (the release job)
#   munaxa-work/admin    apps/admin/Dockerfile
#
# It replaces publish-images.yml (GHCR, for the Render blueprint in munaxa-identity) once the AWS
# deployment is validated; until then both exist and neither runs except on a deliberate tag.
#
# **Tag-triggered, and the tag names the commit.** A tag `image/<40-hex commit SHA>` on a commit
# that is on `main`. The jobs that touch ECR run in the protected `image-release` environment and
# assume this repository's image publisher role through GitHub OIDC; the role's trust requires that
# environment and an image/* tag, and it may push only to this product's repositories. No registry
# credential exists.
#
# **Green CI first.** The `source` job refuses the release unless the workflow "CI" (ci.yml) has a
# completed, successful run on a push to `main` for exactly this commit
# (.github/scripts/require-green-ci.mjs); nothing is built or pushed otherwise. Tag only after
# main's CI run for the commit is green.
#
# **No `latest`.** Two immutable tags per image (`<short>`, `sha-<full>`) and the digest, which is
# what the stack's tfvars name. Inert until the owner sets the repository variable
# AWS_IMAGE_PUBLISHER_ROLE_ARN (munaxa-platform infra/aws/README.md, gate G2).

name: Publish images to ECR

on:
  push:
    tags:
      - 'image/**'

concurrency:
  group: publish-ecr-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished push to a registry

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  REGISTRY: 229251310592.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  source:
    name: Resolve the source commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the CI gate below reads this repository's workflow runs, nothing else
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Read the commit from the tag name
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="${REF_NAME#image/}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tag must be image/<40-hex commit SHA>, got '$REF_NAME'"; exit 1
          fi
          if [ "$GITHUB_SHA" != "$sha" ]; then
            echo "::error::tag $REF_NAME points at $GITHUB_SHA, not at the commit it names"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is on main (reviewed history)
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }

      # MW-009: CI must have passed for this exact commit before anything is built or pushed. The
      # gate accepts only a completed, successful run of ci.yml triggered by a push to main whose
      # head_sha is this commit, and the latest such run decides; pull_request runs never count.
      # Any API error refuses the release (fail closed). The publish job needs this job, so a
      # refusal here stops the release before the image-release environment is even requested.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Test the CI gate (offline)
        run: node --test .github/scripts/require-green-ci.test.mjs

      - name: Require green CI for this commit
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/require-green-ci.mjs "$SHA"

  publish:
    name: ${{ matrix.repository }}
    needs: source
    runs-on: ubuntu-latest
    environment: image-release # required reviewer; the publisher role trusts only this subject
    permissions:
      contents: read
      id-token: write # GitHub OIDC, for the image publisher role
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: munaxa-work/api
            dockerfile: apps/api/Dockerfile
            target: runtime
            build_args: ''
          - repository: munaxa-work/migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            build_args: ''
          - repository: munaxa-work/admin
            dockerfile: apps/admin/Dockerfile
            target: runtime
            build_args: ''
    env:
      SHA: ${{ needs.source.outputs.sha }}
      SHORT: ${{ needs.source.outputs.short }}
    steps:
      - name: Refuse to run before the publisher role exists
        env:
          ROLE: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_IMAGE_PUBLISHER_ROLE_ARN is not set (munaxa-platform infra/aws, gate G2)"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Assume the image publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: gha-publish-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '229251310592'

      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Built and loaded locally first, verified and scanned, and only then pushed: an image with a
      # HIGH or CRITICAL finding (b490b25 shipped CVE-2026-4738, CRITICAL) never reaches ECR again.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: false
          load: true
          provenance: false # a single-platform manifest, so the digest names the image
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.repository }}:${{ env.SHORT }}
            ${{ env.REGISTRY }}/${{ matrix.repository }}:sha-${{ env.SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The registry credential for @munaxa/* as a BuildKit secret, never a build argument.
          secrets: |
            npm_token=${{ secrets.PLATFORM_PACKAGES_TOKEN }}

      - name: Verify and scan before pushing
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          name="${REPOSITORY#munaxa-work/}"
          REF="$REGISTRY/$REPOSITORY:sha-$SHA"
          .github/scripts/verify-image.sh "$REF" "$name"
          .github/scripts/scan-image.sh "$REF" "work-$name" image-reports

      - name: Keep the SBOM and scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-reports-${{ strategy.job-index }}
          path: image-reports/
          if-no-files-found: warn
          retention-days: 400

      - name: Push
        id: build
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          repo="$REGISTRY/$REPOSITORY"
          docker push -q "$repo:$SHORT" >/dev/null
          docker push -q "$repo:sha-$SHA" >/dev/null
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:sha-$SHA" | sed -n "s#^$repo@##p" | head -n1)"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no pushed digest for $repo"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The exact digest that was pushed, pulled back and checked again. A failure here leaves the
      # image in ECR (tags are immutable) but marks the release failed, so nobody pins it.
      - name: Verify the pushed image
        env:
          REPOSITORY: ${{ matrix.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          name="${REPOSITORY#munaxa-work/}"
          REF="$REGISTRY/$REPOSITORY@$DIGEST"
          docker rmi -f "$REGISTRY/$REPOSITORY:sha-$SHA" "$REGISTRY/$REPOSITORY:$SHORT" >/dev/null
          docker pull -q "$REF" >/dev/null
          .github/scripts/verify-image.sh "$REF" "$name"
          {
            echo "### $REPOSITORY"
            echo "\`$REF\` from \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
