name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  standards:
    name: Standards · Architecture · Localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Deliberately runs before (and without) `pnpm install`: the standards gate must not
      # depend on the package registry being reachable. See docs/ENGINEERING_STANDARDS.md.
      - name: Engineering standards
        run: node scripts/check-standards.mjs

      - name: Architecture
        run: node scripts/check-architecture.mjs

      - name: Localization
        run: node scripts/check-localization.mjs

      - name: Dependencies
        run: node scripts/check-dependencies.mjs

      # Without an install this checks declarations only — that no manifest and no lockfile
      # entry resolves an @munaxa/* package from a path. The `node` job runs it again after
      # installing, where it can also compare what is on disk. See the script's header.
      - name: Platform parity
        run: node scripts/check-platform-parity.mjs

  node:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    # A job that exceeds this is not slow, it is stuck — and the default is six hours of a runner
    # producing no output and no logs, which is the worst way to learn that a test suite hangs.
    # Failing here surfaces the logs instead.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    # Tenant isolation is enforced by the database (ADR-0030), so the tests that prove it need a
    # real one. A mock would only prove the mock behaves as instructed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: work
          POSTGRES_PASSWORD: work
          POSTGRES_DB: work
        options: >-
          --health-cmd "pg_isready -U work"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      # The shared design system is published from munaxa-platform to GitHub Packages.
      # `GITHUB_TOKEN` is scoped to *this* repository, and `@munaxa/*` is published from
      # munaxa-platform, so it can only read those packages if that package has separately been
      # granted to this repository. It sufficed until this workspace actually took a dependency on
      # `@munaxa/auth`, at which point install began failing with ERR_PNPM_FETCH_403 — the token was
      # valid and simply not entitled to the package. `PLATFORM_PACKAGES_TOKEN` is the credential
      # the configuration contract names for exactly this, and it is used when present; the
      # fallback keeps the workflow working for whichever remedy an operator chooses, rather than
      # hard-failing on the one they did not.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # Records the exact @munaxa/* versions the rest of this job compiles, lints and tests
      # against. That record is what a local run of the same gate has to match before anyone
      # can say a green local gate means a green CI gate.
      - name: Platform parity
        run: node scripts/check-platform-parity.mjs

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A business module's integration suites exercise the real schema — its row-level security
      # policies, its unique indexes and its check constraints — so the real migrations have to
      # be applied first. Before Phase 2 nothing needed this: the foundation's isolation test
      # creates its own throwaway table and applies the policy procedure to it by hand.
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://work:work@localhost:5432/work

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://work:work@localhost:5432/work

      - name: Build
        run: pnpm build

      # After the build, because it inspects the emitted artefact rather than the source: it walks
      # the module graph from apps/api/dist/main.js and fails if a test double, a harness or
      # @work/testing is reachable from it. Phase 10 shipped an image that died at startup on
      # exactly that, and no source-level gate noticed.
      - name: Check the production output carries no test-only code
        run: pnpm check:production-output

      # `prisma validate` resolves env() at parse time, so the variable must exist. Its value
      # is irrelevant here — nothing connects.
      - name: Validate the Prisma schema
        run: pnpm --filter @work/api exec prisma validate --schema ../../prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://validate:validate@localhost:5432/validate

      - name: Dependency audit
        run: pnpm audit --audit-level high

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # Gradle 8.3, which the Android host project pins, supports Java 17 up to but not
      # including Java 21. Pinning it here means the build does not depend on whichever JDK
      # the runner image happens to default to this month.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable

      # The mobile application has its own toolchain and is not a workspace member.
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build
        working-directory: apps/mobile
        run: flutter build apk --debug

  boundaries:
    name: Product isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The dependency rules are one-directional: this product may depend on the platform
      # and on nothing else in the ecosystem. Catching a stray cross-product import here is
      # far cheaper than untangling it after it ships.
      - name: No cross-product dependencies
        run: |
          set -euo pipefail
          FORBIDDEN='@(school|work|docs|corporate)/'
          if grep -rEn "from '@${FORBIDDEN}" --include=*.ts --include=*.tsx . \
               --exclude-dir=node_modules --exclude-dir=.git \
             | grep -v "@work/"; then
            echo "::error::This repository imports another product. Shared code belongs in munaxa-platform."
            exit 1
          fi
          echo "No cross-product imports."
