# Munaxa Work — an independent product workspace.
#
# Everything here is Munaxa Work's own: its API, admin, mobile, domain packages, Prisma
# schema and infrastructure. The shared design system is NOT a workspace member — it is
# resolved from the registry as @munaxa/*, exactly as in every other product repository.
# Nothing in this repo may depend on another product.
#
# Business code is module-first: packages/modules/<module>/{domain,application,
# infrastructure,contracts,api}. Layers live inside a module, never above it (ADR-0023).
packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/modules/*'
